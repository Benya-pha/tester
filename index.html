<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KARAOKE REMINDER 🎤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (สำหรับ Export Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Mitr -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Mitr', 'sans-serif'],
                    },
                    colors: {
                        earth: {
                            bg: '#F4F1EA',
                            card: '#FFFFFF',
                            text: '#4A4238',
                            muted: '#968C83',
                            accent: '#C58361',
                            accentHover: '#B07252',
                            green: '#889C82',
                            yellow: '#D4B36A',
                            border: '#E6E2D8'
                        }
                    },
                    height: {
                        'screen-dvh': '100dvh',
                    },
                    maxHeight: {
                        '90dvh': '90dvh',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F4F1EA;
            color: #4A4238;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .modal-enter {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .modal-exit {
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }

        /* ป้องกันหน้าจอกระตุกตอน Lock Scroll */
        body.modal-open {
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen pb-24 font-sans">

    <!-- App Container -->
    <div class="max-w-md mx-auto w-full relative min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="p-5 flex justify-between items-center sticky top-0 z-10 bg-earth-bg/90 backdrop-blur-sm">
            <div>
                <h1 class="text-2xl font-semibold text-earth-text">
                    KARAOKE REMINDER
                </h1>
                <p class="text-xs text-earth-muted">บันทึกประวัติการเสียเสียงและเสียตังค์</p>
            </div>
            <div class="bg-earth-card p-2 rounded-full shadow-sm border border-earth-border">
                <i data-lucide="music-4" class="text-earth-accent w-6 h-6"></i>
            </div>
        </header>

        <!-- Dashboard Summary -->
        <div class="px-5 mb-6">
            <div class="bg-earth-accent rounded-3xl p-6 shadow-md relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-white/80 text-sm font-medium mb-1">ยอดเปย์คาราโอเกะปีนี้ (ส่วนของคุณ)</p>
                    <div class="flex items-baseline gap-2 text-white">
                        <span class="text-2xl font-medium">฿</span>
                        <h2 class="text-5xl font-semibold tracking-tight" id="yearly-total">0</h2>
                    </div>
                    <div class="mt-4 flex items-center gap-2 text-sm bg-white/20 w-fit px-3 py-1.5 rounded-2xl text-white">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span id="current-year-display">ปี 2026</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="px-5 flex gap-3 mb-8">
            <button onclick="quickAddToday()" class="flex-1 bg-earth-text hover:bg-black/80 transition-colors text-white py-3.5 rounded-2xl font-medium shadow-sm flex items-center justify-center gap-2 active:scale-95">
                <i data-lucide="mic" class="w-5 h-5"></i>
                ร้องวันนี้เลย!
            </button>
            <button onclick="openModal()" class="flex-none bg-earth-card hover:bg-gray-50 border border-earth-border transition-colors px-4 rounded-2xl font-medium flex items-center justify-center gap-2 active:scale-95 text-earth-text shadow-sm" title="เพิ่มประวัติย้อนหลัง">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- History List -->
        <div class="px-5 flex-1">
            <div class="flex justify-between items-end mb-4">
                <h3 class="text-lg font-medium text-earth-text">ประวัติการไปร้อง 🎤</h3>
                <div class="flex items-center gap-2">
                    <button onclick="exportToExcel()" class="text-xs bg-earth-green/10 text-earth-green hover:bg-earth-green/20 px-2 py-1 rounded-lg flex items-center gap-1 transition-colors border border-earth-green/20">
                        <i data-lucide="sheet" class="w-3 h-3"></i> Excel
                    </button>
                    <span class="text-xs text-earth-muted bg-earth-border/50 px-2 py-1 rounded-lg" id="total-sessions-count">0 รายการ</span>
                </div>
            </div>
            
            <div id="history-list" class="space-y-3 pb-10">
                <!-- รายการจะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

    </div>

    <!-- Modal Form (Add/Edit) แบบฟิกซ์โครงสร้าง -->
    <div id="entry-modal" class="fixed inset-0 z-50 hidden flex-col justify-end">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-earth-text/60 backdrop-blur-sm" onclick="closeModal()"></div>
        
        <!-- Modal Content (Fixed structure) -->
        <div class="relative w-full max-w-md mx-auto bg-earth-bg rounded-t-3xl shadow-2xl flex flex-col max-h-[90dvh]" id="modal-content">
            
            <!-- Handle indicator for mobile -->
            <div class="w-full flex justify-center pt-4 pb-2 flex-none cursor-pointer" onclick="closeModal()">
                <div class="w-12 h-1.5 bg-earth-border rounded-full"></div>
            </div>

            <!-- Modal Header -->
            <div class="px-6 pb-4 flex justify-between items-center flex-none border-b border-earth-border/50">
                <h2 class="text-xl font-medium text-earth-text" id="modal-title">เพิ่มประวัติการร้อง</h2>
                <button type="button" onclick="closeModal()" class="p-2 bg-earth-card border border-earth-border rounded-full text-earth-muted hover:text-earth-text active:scale-95 transition-transform">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Scrollable Form Body -->
            <form id="karaoke-form" onsubmit="saveEntry(event)" class="flex flex-col flex-1 overflow-hidden">
                
                <!-- ส่วนเนื้อหาที่เลื่อนได้ -->
                <div class="px-6 py-5 overflow-y-auto flex-1 space-y-4 overscroll-contain">
                    <input type="hidden" id="entry-id">
                    
                    <!-- Date -->
                    <div>
                        <label class="block text-sm font-medium text-earth-muted mb-1.5">วันที่ไปร้อง</label>
                        <input type="date" id="entry-date" required class="w-full bg-earth-card border border-earth-border rounded-2xl px-4 py-3 text-earth-text focus:outline-none focus:border-earth-accent focus:ring-1 focus:ring-earth-accent transition-colors appearance-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Hours -->
                        <div>
                            <label class="block text-sm font-medium text-earth-muted mb-1.5">จำนวนชั่วโมง</label>
                            <div class="relative">
                                <input type="number" id="entry-hours" min="0.5" step="0.5" placeholder="เช่น 2" oninput="autoCalculateTotal()" class="w-full bg-earth-card border border-earth-border rounded-2xl pl-4 pr-10 py-3 text-earth-text focus:outline-none focus:border-earth-accent focus:ring-1 focus:ring-earth-accent transition-colors">
                                <span class="absolute right-4 top-3.5 text-earth-muted text-sm">ชม.</span>
                            </div>
                        </div>

                        <!-- People -->
                        <div>
                            <label class="block text-sm font-medium text-earth-muted mb-1.5">จำนวนคน</label>
                            <div class="relative">
                                <input type="number" id="entry-people" min="1" step="1" required placeholder="เช่น 4" oninput="autoCalculateTotal()" class="w-full bg-earth-card border border-earth-border rounded-2xl pl-4 pr-10 py-3 text-earth-text focus:outline-none focus:border-earth-accent focus:ring-1 focus:ring-earth-accent transition-colors">
                                <span class="absolute right-4 top-3.5 text-earth-muted text-sm">คน</span>
                            </div>
                        </div>
                    </div>
                    <!-- Note for auto calculate -->
                    <p class="text-[11px] text-earth-accent/80 text-right mt-1">* 1-7 คน ชม.ละ 100 ฿ | 8 คนขึ้นไป ชม.ละ 150 ฿</p>

                    <!-- Payer -->
                    <div>
                        <label class="block text-sm font-medium text-earth-muted mb-2">ใครจ่ายบิลก่อน?</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="payer" value="ฉันจ่าย" class="peer sr-only" checked onchange="toggleFriendNameInput()">
                                <div class="text-center text-sm bg-earth-card border border-earth-border rounded-2xl py-3 peer-checked:bg-earth-accent/10 peer-checked:border-earth-accent peer-checked:text-earth-accent transition-colors">
                                    ฉันเอง 🙋🏻‍♂️
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="payer" value="เพื่อนจ่าย" class="peer sr-only" onchange="toggleFriendNameInput()">
                                <div class="text-center text-sm bg-earth-card border border-earth-border rounded-2xl py-3 peer-checked:bg-earth-green/10 peer-checked:border-earth-green peer-checked:text-earth-green transition-colors">
                                    เพื่อนจ่ายก่อน 🫂
                                </div>
                            </label>
                        </div>
                        
                        <!-- ช่องกรอกชื่อเพื่อน (จะโชว์ก็ต่อเมื่อเลือก "เพื่อนจ่าย") -->
                        <div id="friend-name-container" class="hidden mt-3">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i data-lucide="user" class="h-4 w-4 text-earth-muted"></i>
                                </div>
                                <input type="text" id="entry-friend-name" placeholder="ระบุชื่อคนจ่าย (ไม่บังคับ)" class="w-full bg-earth-card border border-earth-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-earth-text focus:outline-none focus:border-earth-green focus:ring-1 focus:ring-earth-green transition-colors">
                            </div>
                        </div>
                    </div>

                    <div class="bg-earth-card p-5 rounded-2xl border border-earth-border mt-4 shadow-sm space-y-4 relative">
                        <!-- Total Cost -->
                        <div>
                            <label class="block text-sm font-medium text-earth-muted mb-1.5 flex justify-between">
                                <span>ค่าใช้จ่ายรวม (บาท)</span>
                                <span class="text-[10px] text-earth-muted font-normal">*แก้ไขได้ถ้ามีค่าอาหาร</span>
                            </label>
                            <input type="number" id="entry-total-cost" min="0" required placeholder="0" oninput="calculateShare()" class="w-full bg-earth-bg border border-earth-border rounded-xl px-4 py-3 text-xl font-medium text-earth-text focus:outline-none focus:border-earth-accent focus:ring-1 focus:ring-earth-accent text-right transition-colors">
                        </div>

                        <!-- My Share -->
                        <div>
                            <label class="block text-sm font-medium text-earth-accent mb-1.5 flex justify-between">
                                <span>ส่วนที่ฉันต้องจ่าย (บาท)</span>
                            </label>
                            <input type="number" id="entry-my-share" min="0" required placeholder="0" class="w-full bg-earth-accent/5 border border-earth-accent/30 rounded-xl px-4 py-3 text-xl font-medium text-earth-accent focus:outline-none focus:border-earth-accent focus:ring-1 focus:ring-earth-accent text-right transition-colors">
                        </div>
                    </div>
                    
                    <!-- พื้นที่ว่างด้านล่างเผื่อเลื่อนสุด -->
                    <div class="h-4"></div>
                </div>

                <!-- Sticky Footer Buttons (ล็อคปุ่มไว้ล่างสุด) -->
                <div class="px-6 py-4 bg-earth-bg border-t border-earth-border flex gap-3 flex-none pb-8 sm:pb-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                    <button type="button" id="btn-delete" onclick="deleteCurrentEntry()" class="hidden flex-none bg-[#ffebe6] text-[#d65d45] border border-[#d65d45]/20 hover:bg-[#ffd6cc] px-4 rounded-2xl font-medium transition-colors active:scale-95">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                    <button type="submit" class="flex-1 bg-earth-accent hover:bg-earth-accentHover text-white py-3.5 rounded-2xl font-medium shadow-sm transition-colors text-lg active:scale-95">
                        บันทึกข้อมูล
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // State management
        const STORAGE_KEY = 'karaoke_sessions';
        let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        
        // DOM Elements
        const historyList = document.getElementById('history-list');
        const yearlyTotalEl = document.getElementById('yearly-total');
        const currentYearDisplay = document.getElementById('current-year-display');
        const countDisplay = document.getElementById('total-sessions-count');
        const modal = document.getElementById('entry-modal');
        const modalContent = document.getElementById('modal-content');
        const form = document.getElementById('karaoke-form');
        const friendNameContainer = document.getElementById('friend-name-container');

        // Initialize App
        function initApp() {
            const currentYear = new Date().getFullYear();
            currentYearDisplay.textContent = `ปี ${currentYear}`;
            renderDashboard();
            renderHistory();
        }

        // --- Core Functions ---

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
            renderDashboard();
            renderHistory();
        }

        function renderDashboard() {
            const currentYear = new Date().getFullYear().toString();
            
            // Calculate total my_share for the current year
            const yearlyTotal = sessions
                .filter(s => s.date.startsWith(currentYear))
                .reduce((sum, s) => sum + (Number(s.myShare) || 0), 0);
            
            // Animate number
            animateValue(yearlyTotalEl, parseInt(yearlyTotalEl.textContent.replace(/,/g, '')) || 0, yearlyTotal, 500);
            
            countDisplay.textContent = `${sessions.length} รายการ`;
        }

        function renderHistory() {
            historyList.innerHTML = '';

            if (sessions.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-12 px-4 bg-earth-card border border-earth-border rounded-3xl shadow-sm">
                        <div class="bg-earth-bg w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="mic-off" class="w-8 h-8 text-earth-muted"></i>
                        </div>
                        <p class="text-earth-text font-medium">ยังไม่มีประวัติการร้องเพลง</p>
                        <p class="text-earth-muted text-sm mt-1">กดปุ่ม "ร้องวันนี้เลย!" เพื่อเริ่มบันทึก</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Sort by date descending
            const sortedSessions = [...sessions].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedSessions.forEach(session => {
                const dateObj = new Date(session.date);
                
                let payerBadge = '';
                let payerColor = '';
                
                if (session.payer === 'ฉันจ่าย') {
                    payerBadge = 'ฉันจ่าย';
                    payerColor = 'text-earth-accent bg-earth-accent/10 border-earth-accent/20';
                } else if (session.payer === 'เพื่อนจ่าย') {
                    // เช็คว่ามีกรอกชื่อเพื่อนไว้หรือไม่ ถ้ามีเอาชื่อขึ้นก่อน
                    if (session.friendName && session.friendName.trim() !== '') {
                        payerBadge = `${session.friendName} จ่ายก่อน`;
                    } else {
                        payerBadge = 'เพื่อนจ่ายก่อน';
                    }
                    payerColor = 'text-earth-green bg-earth-green/10 border-earth-green/20';
                }

                const card = document.createElement('div');
                card.className = 'bg-earth-card p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:bg-gray-50 border border-earth-border shadow-sm transition-colors active:scale-[0.98]';
                card.onclick = () => openModal(session.id);
                
                card.innerHTML = `
                    <div class="bg-earth-bg rounded-xl p-3 flex flex-col items-center justify-center w-14 h-14 border border-earth-border/50 flex-none">
                        <span class="text-[11px] text-earth-muted leading-tight">${dateObj.toLocaleDateString('th-TH', { month: 'short'})}</span>
                        <span class="text-lg font-medium leading-none text-earth-text mt-0.5">${dateObj.getDate()}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="font-medium text-earth-text truncate pr-2">ร้อง ${session.hours || '?'} ชม. (${session.people} คน)</h4>
                            <span class="font-medium text-earth-text whitespace-nowrap">฿${Number(session.myShare).toLocaleString()}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-md border ${payerColor} truncate max-w-[150px]">
                                ${payerBadge}
                            </span>
                            <span class="text-xs text-earth-muted whitespace-nowrap">รวม ฿${Number(session.totalCost).toLocaleString()}</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-earth-muted/50 flex-none"></i>
                `;
                historyList.appendChild(card);
            });
            
            lucide.createIcons();
        }

        // --- Export to Excel Function ---
        function exportToExcel() {
            if (sessions.length === 0) {
                alert('ยังไม่มีข้อมูลให้ Export ครับ ลองเพิ่มรายการก่อนนะ');
                return;
            }

            // 1. Prepare Data for Excel
            const data = sessions.map(s => {
                let payerText = s.payer;
                if (s.payer === 'เพื่อนจ่าย' && s.friendName) {
                    payerText = `เพื่อนจ่าย (${s.friendName})`;
                }

                return {
                    "วันที่": s.date,
                    "ชั่วโมง": s.hours || 0,
                    "จำนวนคน": s.people || 0,
                    "ค่าใช้จ่ายรวม (บาท)": s.totalCost || 0,
                    "ส่วนของฉัน (บาท)": s.myShare || 0,
                    "ใครจ่าย": payerText
                };
            });

            // 2. Create Workbook
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);

            // Auto-width columns (Simple estimation)
            const wscols = [
                {wch: 12}, // Date
                {wch: 8},  // Hours
                {wch: 10}, // People
                {wch: 15}, // Total
                {wch: 15}, // My Share
                {wch: 20}  // Payer
            ];
            ws['!cols'] = wscols;

            XLSX.utils.book_append_sheet(wb, ws, "Karaoke History");

            // 3. Generate File Name with Date
            const dateStr = new Date().toISOString().split('T')[0];
            const fileName = `Karaoke_Reminder_Export_${dateStr}.xlsx`;

            // 4. Download
            XLSX.writeFile(wb, fileName);
        }

        // --- Form & Modal Logic ---

        function toggleFriendNameInput() {
            const radios = document.getElementsByName('payer');
            let isFriendPaid = false;
            
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked && radios[i].value === 'เพื่อนจ่าย') {
                    isFriendPaid = true;
                    break;
                }
            }
            
            if (isFriendPaid) {
                friendNameContainer.classList.remove('hidden');
            } else {
                friendNameContainer.classList.add('hidden');
                document.getElementById('entry-friend-name').value = ''; // เคลียร์ค่าออกถ้าเปลี่ยนใจไม่เลือกเพื่อนจ่าย
            }
        }

        // ฟังก์ชันใหม่: คำนวณยอดรวมอัตโนมัติตามเรทราคา
        function autoCalculateTotal() {
            const hours = parseFloat(document.getElementById('entry-hours').value) || 0;
            const people = parseInt(document.getElementById('entry-people').value) || 0;
            
            if (hours > 0 && people > 0) {
                // เรท: 1-7 คน = 100/ชม. , >7 คน = 150/ชม.
                const ratePerHour = people > 7 ? 150 : 100;
                const totalCost = hours * ratePerHour;
                
                document.getElementById('entry-total-cost').value = totalCost;
            }
            
            // ให้ทำการหารส่วนแบ่งต่อเลย
            calculateShare();
        }

        // ฟังก์ชันเดิม: หารส่วนแบ่ง
        function calculateShare() {
            const total = parseFloat(document.getElementById('entry-total-cost').value) || 0;
            const people = parseInt(document.getElementById('entry-people').value) || 1;
            
            if (total > 0 && people > 0) {
                const share = Math.ceil(total / people); // ปัดเศษขึ้นเสมอ
                document.getElementById('entry-my-share').value = share;
            } else {
                document.getElementById('entry-my-share').value = '';
            }
        }

        function quickAddToday() {
            openModal();
            // Default to 1 person, 1 hour
            document.getElementById('entry-people').value = 1;
            document.getElementById('entry-hours').value = 1;
            
            // คำนวณราคาเริ่มต้นอัตโนมัติ
            autoCalculateTotal();
            
            // รอให้ modal เปิดเสร็จก่อนโฟกัส input
            setTimeout(() => {
                document.getElementById('entry-total-cost').focus();
            }, 300);
        }

        function openModal(editId = null) {
            // Lock body scroll
            document.body.classList.add('modal-open');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modalContent.classList.remove('modal-exit');
            modalContent.classList.add('modal-enter');
            
            form.reset();
            document.getElementById('entry-id').value = '';
            document.getElementById('entry-friend-name').value = '';
            document.getElementById('btn-delete').classList.add('hidden');
            document.getElementById('modal-title').textContent = 'เพิ่มประวัติการร้อง';
            
            // ตั้งค่าเริ่มต้นของฟอร์มใหม่
            toggleFriendNameInput(); 

            // Set today as default date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('entry-date').value = today;

            if (editId) {
                const session = sessions.find(s => s.id === editId);
                if (session) {
                    document.getElementById('modal-title').textContent = 'แก้ไขข้อมูล';
                    document.getElementById('entry-id').value = session.id;
                    document.getElementById('entry-date').value = session.date;
                    document.getElementById('entry-hours').value = session.hours || '';
                    document.getElementById('entry-people').value = session.people || '';
                    document.getElementById('entry-total-cost').value = session.totalCost || '';
                    document.getElementById('entry-my-share').value = session.myShare || '';
                    document.getElementById('entry-friend-name').value = session.friendName || '';
                    
                    // Radio button
                    const radios = document.getElementsByName('payer');
                    for (let i = 0; i < radios.length; i++) {
                        if (radios[i].value === session.payer) {
                            radios[i].checked = true;
                            break;
                        }
                    }
                    
                    // เรียกเช็คอีกรอบเพื่อโชว์/ซ่อน กล่องชื่อเพื่อน
                    toggleFriendNameInput();
                    
                    document.getElementById('btn-delete').classList.remove('hidden');
                }
            } else {
                document.getElementById('entry-people').value = '';
            }
        }

        function closeModal() {
            // Unlock body scroll
            document.body.classList.remove('modal-open');

            modalContent.classList.remove('modal-enter');
            modalContent.classList.add('modal-exit');
            
            // Wait for animation to finish before hiding
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function saveEntry(e) {
            e.preventDefault();
            
            const id = document.getElementById('entry-id').value || Date.now().toString();
            
            // Get selected radio value
            let payerValue = 'ฉันจ่าย';
            const radios = document.getElementsByName('payer');
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    payerValue = radios[i].value;
                    break;
                }
            }

            const newSession = {
                id: id,
                date: document.getElementById('entry-date').value,
                hours: parseFloat(document.getElementById('entry-hours').value) || null,
                people: parseInt(document.getElementById('entry-people').value) || 1,
                totalCost: parseFloat(document.getElementById('entry-total-cost').value) || 0,
                myShare: parseFloat(document.getElementById('entry-my-share').value) || 0,
                payer: payerValue,
                friendName: payerValue === 'เพื่อนจ่าย' ? document.getElementById('entry-friend-name').value : ''
            };

            const existingIndex = sessions.findIndex(s => s.id === id);
            if (existingIndex >= 0) {
                sessions[existingIndex] = newSession; // Update
            } else {
                sessions.push(newSession); // Add new
            }

            saveData();
            closeModal();
        }

        function deleteCurrentEntry() {
            const id = document.getElementById('entry-id').value;
            if (!id) return;
            
            if(confirm('ต้องการลบประวัติการร้องนี้ใช่หรือไม่?')) {
                sessions = sessions.filter(s => s.id !== id);
                saveData();
                closeModal();
            }
        }

        // Utils: Number Animation
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const currentVal = Math.floor(progress * (end - start) + start);
                obj.innerHTML = currentVal.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString();
                }
            };
            window.requestAnimationFrame(step);
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
